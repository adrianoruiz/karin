<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Dra. Karin Boldarini</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Página servida pelo nginx (error_page 404 /error/404.html); independente do build Nuxt -->
  <style>
    @font-face { font-family: 'Aloe-Medium'; src: url('/fonts/Aloe-Medium.woff2') format('woff2'); font-display: swap; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #F5F1EB; color: #2D2B28;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
    }
    main { max-width: 480px; }
    .code { font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: #6F6A64; }
    h1 { margin: 16px 0 12px; font-family: 'Aloe-Medium', serif; font-weight: 500; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.1; }
    p { color: #4A4744; line-height: 1.6; }
    a {
      display: inline-block; margin-top: 28px; padding: 14px 28px; border-radius: 999px;
      background: #8B7355; color: #fff; text-decoration: none; font-weight: 500;
    }
    a:hover, a:focus-visible { background: #6D5A43; }
    footer { margin-top: 40px; font-size: 0.8125rem; color: #6F6A64; }
  </style>
</head>
<body>
  <main>
    <div class="code">Erro 404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi removido.</p>
    <a href="/">Voltar para o início</a>
    <footer>Dra. Karin Alana da Rosa Boldarini — MÉDICA — CRM-SC 26.419</footer>
  </main>
</body>
</html>
